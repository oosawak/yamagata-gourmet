<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>まるもりグルメラリー2026 ― 八島大祐さんの訪問記録</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light only;
        --paper: #faf5ea;
        --paper-2: #f3ead6;
        --card: #fffdf7;
        --ink: #33302a;
        --ink-soft: #6d675c;
        --line: #ddd2ba;
        --accent: #b3541e;      /* persimmon */
        --accent-ink: #8a3d12;
        --olive: #66713c;
        --olive-soft: #e7ead3;
        --stamp: #a63d1c;
        --chip: #efe6cf;
        --shadow: 0 2px 10px rgba(90, 64, 30, .10);
        --scrim-top: rgba(255, 253, 247, .22);
        --scrim-bottom: rgba(255, 253, 247, .82);
      }
      /* Always light theme — do not follow device dark mode, to avoid the page turning near-black */
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
        line-height: 1.75;
        -webkit-text-size-adjust: 100%;
      }
      a { color: var(--accent-ink); }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 0 18px 64px; }

      /* ---------- hero ---------- */
      .hero { padding: 28px 0 8px; }
      .hero-img {
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        position: relative;
      }
      .hero-badge {
        position: absolute; right: 14px; bottom: 14px;
        background: rgba(250, 245, 234, .92); color: #8a3d12;
        font-weight: 900; font-size: clamp(.85rem, 3vw, 1.05rem);
        padding: 6px 16px; border-radius: 999px;
        border: 1.5px solid #b3541e; transform: rotate(-2deg);
      }
      .hero-img img { display: block; width: 100%; height: auto; }
      .hero figcaption, .dishfig figcaption {
        font-size: .78rem; color: var(--ink-soft); padding: 6px 4px 0; text-align: right;
      }
      figure { margin: 0; }
      .tagline {
        display: inline-block; margin-top: 26px;
        background: var(--olive-soft); color: var(--olive);
        font-weight: 900; font-size: .82rem; letter-spacing: .14em;
        padding: 4px 14px; border-radius: 999px;
      }
      h1 {
        font-family: "Shippori Mincho B1", serif;
        font-size: clamp(1.9rem, 6vw, 3rem);
        line-height: 1.3; margin: 14px 0 4px; font-weight: 800;
      }
      h1 .accent { color: var(--accent); }
      .subtitle { font-size: clamp(1rem, 3.4vw, 1.2rem); font-weight: 700; color: var(--ink-soft); margin: 0 0 14px; }
      .lead { max-width: 46em; margin: 0 0 10px; }
      .lead strong { color: var(--accent-ink); }

      /* ---------- progress / stamp card ---------- */
      .rally {
        margin-top: 26px; background: var(--card);
        border: 1.5px dashed var(--accent);
        border-radius: 14px; padding: 20px 20px 16px;
        box-shadow: var(--shadow);
      }
      .rally-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
      .rally-head h2 { font-family: "Shippori Mincho B1", serif; font-size: 1.25rem; margin: 0; }
      .rally-count { font-weight: 900; color: var(--accent-ink); font-size: 1.05rem; }
      .rally-count .big { font-size: 1.7rem; }
      .bar { height: 10px; border-radius: 999px; background: var(--chip); overflow: hidden; margin: 12px 0 16px; }
      .bar > div { height: 100%; width: 41.6%; background: var(--accent); border-radius: 999px; }
      .stamps { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
      .stamp {
        aspect-ratio: 1; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: .95rem; text-decoration: none;
        border: 2px solid var(--stamp); color: var(--stamp);
        background: color-mix(in srgb, var(--stamp) 8%, transparent);
        transform: rotate(-4deg);
      }
      .stamp.done:hover { background: var(--stamp); color: #fff; }
      .stamp.todo { border-style: dashed; border-color: var(--line); color: var(--ink-soft); background: transparent; transform: none; font-size: .72rem; font-weight: 700; }
      .rally-note { font-size: .85rem; color: var(--ink-soft); margin: 12px 0 0; }
      @media (max-width: 560px) { .stamps { grid-template-columns: repeat(6, 1fr); } }

      /* ---------- filters ---------- */
      .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 34px 0 6px; }
      .filters button {
        font: inherit; font-weight: 700; font-size: .9rem;
        border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
        padding: 6px 16px; border-radius: 999px; cursor: pointer;
      }
      .filters button[aria-pressed="true"] { background: var(--olive); border-color: var(--olive); color: #fff; }

      h2.section { font-family: "Shippori Mincho B1", serif; font-size: 1.5rem; margin: 10px 0 4px; }
      .section-note { color: var(--ink-soft); font-size: .9rem; margin: 0 0 18px; }

      /* ---------- cards (photo background) ---------- */
      .cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
      @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }
      .card {
        border: 1px solid var(--line); border-radius: 14px;
        box-shadow: var(--shadow); position: relative; overflow: hidden;
        scroll-margin-top: 16px; background: var(--card);
        display: flex; flex-direction: column;
      }
      .card[hidden] { display: none; }
      .card-bg {
        position: absolute; inset: 0;
        background-size: cover; background-position: center;
        filter: saturate(1.55) contrast(1.22) brightness(1.05);
      }

      .card-scrim {
        position: absolute; inset: 0;
        background: linear-gradient(180deg, var(--scrim-top) 0%, var(--scrim-top) 30%, var(--scrim-bottom) 72%, var(--scrim-bottom) 100%);
      }
      .card-inner { position: relative; padding: 20px 20px 16px; display: flex; flex-direction: column; flex: 1; }
      .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .seal {
        flex: none; width: 58px; height: 58px; border-radius: 50%;
        border: 2.5px solid var(--stamp); color: var(--stamp);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        transform: rotate(-6deg); line-height: 1.1;
        background: color-mix(in srgb, var(--stamp) 7%, var(--card));
      }
      .seal .n { font-size: 1.3rem; font-weight: 900; }
      .seal .lbl { font-size: .55rem; font-weight: 900; letter-spacing: .08em; }
      .meta { text-align: right; font-size: .8rem; color: var(--ink-soft); }
      .cat {
        display: inline-block; background: var(--chip); color: var(--ink);
        font-size: .72rem; font-weight: 900; padding: 2px 10px; border-radius: 999px; margin-bottom: 4px;
      }
      .card h3 { font-family: "Shippori Mincho B1", serif; font-size: 1.3rem; margin: 8px 0 0; line-height: 1.4; }
      .dish { font-weight: 900; color: var(--accent-ink); font-size: 1.02rem; margin: 2px 0 8px; }
      .card p { margin: 0 0 12px; font-size: .95rem; }
      .addr { font-size: .85rem; color: var(--ink-soft); margin: 0 0 14px; }
      .photo-note { font-size: .72rem; color: var(--ink-soft); margin: auto 0 10px; }
      .links { display: flex; flex-wrap: wrap; gap: 8px; }
      .links a {
        text-decoration: none; font-weight: 700; font-size: .88rem;
        border: 1.5px solid var(--accent); color: var(--accent-ink);
        padding: 7px 14px; border-radius: 999px; background: var(--card);
      }
      .links a.primary { background: var(--accent); color: #fff; }

      .links a:hover { opacity: .85; }

      /* ---------- dishes figure / footer ---------- */
      .dishfig { margin: 40px 0 0; }
      .dishfig .hero-img { border-radius: 18px; }
      .dishfig img { display: block; width: 100%; height: auto; }
      footer {
        margin-top: 44px; border-top: 1px solid var(--line); padding-top: 20px;
        font-size: .88rem; color: var(--ink-soft);
      }
      footer p { margin: 0 0 8px; }
      .empty { display: none; color: var(--ink-soft); padding: 24px 0; }
    </style>
  </head>
